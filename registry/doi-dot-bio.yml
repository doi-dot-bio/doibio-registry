# doi.bio registry: the base vaults operated by doi.bio itself (lab "doi-dot-bio").
# One file per operator: registry/<lab>.yml. Field reference: ../README.md.
# Hand-maintained for now; central (github.com/sness23/www0) will read it once ingest lands.
lab: doi-dot-bio
name: doi.bio base vaults
operator: doi.bio
contact: https://doi.bio/agents
maintainers: [sness]
content_license: CC-BY-SA-4.0
updated: 2026-10-22
nodes:
  www0:
    role: production writer     # the one server that serves doi.bio and commits edits
    root: /Users/sness/data/vaults
  bb:
    role: master copy           # the workstation holding every base vault and the search index
    root: ~/data/vaults
vaults:
  - name: doi
    kind: vault
    host: doi.bio
    origin:
      type: git
      url: https://github.com/doi-dot-bio/doi_doi
      branch: main
      visibility: private
    locations:
      - {type: disk, node: bb, path: ~/data/vaults/doi}
      - {type: disk, node: www0, path: /Users/sness/data/vaults/doi, serves: true}
      - {type: s3, bucket: doi.doi.bio, region: us-west-2}
    served: true
    editing: public
    files: 112
    markdown: 91
    size: 43M
    note: "the root vault: doi.bio/<slug> is a live topic page over every vault, a file here is the curated overlay"
